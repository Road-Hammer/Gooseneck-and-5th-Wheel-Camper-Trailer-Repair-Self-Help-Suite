    title: "Equine & Stock Trailers"
    description: "Horse, cattle, and livestock trailers — floors, dividers, gates, ventilation, animal safety."
  - id: safe_operation
    title: "Safe Operation"
    description: "Pre-trip, weight distribution, sway, hills, backing, weather, fatigue."
  - id: service_log
    title: "Service Log / Shop CMMS"
    description: "Work orders, repair history, vendors linked to guides — offline shop tracking."
  - id: trucker_wisdom
    title: "Trucker Wisdom (30+ Years)"
    description: "Highway-proven habits that manuals rarely teach entry-level owners."
  - id: emergency
    title: "Roadside & Emergency"
    description: "Blowouts, no brakes light, overheating hubs, what not to do."

